# ~/.config/kitty/kitty.conf

# === Molokai-inspired Color Scheme ===
# Based on the Molokai colorscheme used in your vimrc

# Background colors (solid - no transparency for performance)
background            #202020

# Foreground/text colors
foreground           #F8F8F2

# Cursor
cursor               #F8F8F2
cursor_text_color    #202020

# Black (dimmed)
color0               #1E1E1E
color8               #75715E

# Red (keywords, errors)
color1               #F92672
color9               #FF6680

# Green (strings)
color2               #A6E22E
color10              #B7E563

# Yellow (numbers, warnings)
color3               #E6DB74
color11              #FFE46B

# Blue (type qualifiers, special)
color4               #66D9EF
color12              #89DDFF

# Magenta (constants, regex)
color5               #FD5FF1
color13              #FF79C6

# Cyan (functions)
color6               #AE81FF
color14              #A6FFEF

# White (bright)
color7               #F8F8F2
color15              #FFFFFF

# === Window & Layout ===
# No padding for maximum performance
window_padding_width 0
window_border_width  0
disable_window_resize_history yes

# === Font ===
# Uncomment and set your preferred font
# font_family      JetBrains Mono
# font_size        12.0
# bold_font        JetBrains Mono Bold
# italic_font     JetBrains Mono Italic

# === Visual Settings ===
# No transparency - Hyprland handles compositing separately
# Minimal decorations for performance
hide_window_decorations yes
draw_minimal_borders yes
# No blur - disabled for performance

# === Tab Bar ===
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style round
active_tab_foreground   #202020
active_tab_background   #A6E22E
inactive_tab_foreground #F8F8F2
inactive_tab_background #1E1E1E

# === Scrollback ===
scrollback_lines    10000
scrollback_pager_history_size 100

# === Performance ===
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# === Bell ===
enable_audio_bell no
window_alert_on_bell yes

# === Mouse ===
url_color #66D9EF
open_url_with firefox

# === Keybindings ===
# Resize windows
map ctrl+left_parenthesis  resize_window_by 25 0
map ctrl+right_parenthesis resize_window_by -25 0
map ctrl+up_parenthesis    resize_window_by 0 -25
map ctrl+down_parenthesis  resize_window_by 0 25

# Scroll page up/down
map ctrl+shift+up    scroll_page_up
map ctrl+shift+down  scroll_page_down

# Copy/paste
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard

# New tab/window
map ctrl+shift+t  new_tab
map ctrl+shift+n  new_window

# Tab navigation
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+w        close_tab

# === Shell ===
shell bash
shell_integration enabled

# === Advanced ===
confirm_os_window_close 0
auto_reload always
