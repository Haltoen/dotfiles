# ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    time_format = %H:%M:%S
    date_format = %A, %B %d
}

auth {
    pam {
        enabled = true
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot      # blurs your current desktop; or use a path like ~/Pictures/wall.png
    blur_passes = 3
    blur_size = 7
}

# Theme: beige #9b917d / amber #dc9d65 / taupe #91857a / brown #665343 / dark #272826

# Clock with seconds
label {
    monitor =
    text = $TIME
    color = rgba(220, 157, 101, 1.0)   # amber
    font_size = 90
    font_family = Noto Sans, Noto Sans CJK JP
    position = 0, 200
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi there, $USER
    color = rgba(155, 145, 125, 1.0)   # beige
    font_size = 22
    font_family = Noto Sans, Noto Sans CJK JP
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(39, 40, 38, 0.5)              # dark
    outer_color = rgb(dc9d65) rgb(9b917d) 45deg      # amber -> beige
    check_color = rgb(91857a) rgb(9b917d) 120deg     # taupe -> beige
    fail_color = rgb(665343) rgb(dc9d65) 40deg       # brown -> amber
    font_color = rgb(220, 157, 101)                  # amber
    fade_on_empty = false
    rounding = 15
    placeholder_text = Enter password...
    fail_text = $PAMFAIL
    position = 0, -80
    halign = center
    valign = center
}
